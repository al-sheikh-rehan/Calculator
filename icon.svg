<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Body Chassis -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Calculator Screen -->
  <rect x="72" y="72" width="368" height="110" rx="24" fill="url(#screenGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  
  <!-- Mini Screen Expression & Result -->
  <text x="410" y="112" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="20" font-weight="500" text-anchor="end">128 × 4</text>
  <text x="410" y="158" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="40" font-weight="700" text-anchor="end">512</text>

  <!-- Keypad Grid Row 1 -->
  <rect x="72" y="210" width="76" height="60" rx="16" fill="#334155"/>
  <text x="110" y="248" fill="#f87171" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" text-anchor="middle">AC</text>

  <rect x="169" y="210" width="76" height="60" rx="16" fill="#334155"/>
  <text x="207" y="248" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" text-anchor="middle">±</text>

  <rect x="266" y="210" width="76" height="60" rx="16" fill="#334155"/>
  <text x="304" y="248" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="22" font-weight="700" text-anchor="middle">%</text>

  <rect x="364" y="210" width="76" height="60" rx="16" fill="#451a03"/>
  <text x="402" y="250" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="26" font-weight="700" text-anchor="middle">÷</text>

  <!-- Keypad Grid Row 2 -->
  <rect x="72" y="286" width="76" height="60" rx="16" fill="#1e293b"/>
  <text x="110" y="324" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">7</text>

  <rect x="169" y="286" width="76" height="60" rx="16" fill="#1e293b"/>
  <text x="207" y="324" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">8</text>

  <rect x="266" y="286" width="76" height="60" rx="16" fill="#1e293b"/>
  <text x="304" y="324" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">9</text>

  <rect x="364" y="286" width="76" height="60" rx="16" fill="#451a03"/>
  <text x="402" y="326" fill="#fbbf24" font-family="-apple-system, sans-serif" font-size="26" font-weight="700" text-anchor="middle">×</text>

  <!-- Keypad Grid Row 3 -->
  <rect x="72" y="362" width="76" height="60" rx="16" fill="#1e293b"/>
  <text x="110" y="400" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">4</text>

  <rect x="169" y="362" width="76" height="60" rx="16" fill="#1e293b"/>
  <text x="207" y="400" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">5</text>

  <rect x="266" y="362" width="76" height="60" rx="16" fill="#1e293b"/>
  <text x="304" y="400" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">6</text>

  <rect x="364" y="362" width="76" height="136" rx="20" fill="url(#accentGrad)" filter="url(#glow)"/>
  <text x="402" y="442" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="34" font-weight="700" text-anchor="middle">=</text>

  <!-- Keypad Grid Row 4 (0 & .) -->
  <rect x="72" y="438" width="173" height="60" rx="16" fill="#1e293b"/>
  <text x="158" y="476" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">0</text>

  <rect x="266" y="438" width="76" height="60" rx="16" fill="#1e293b"/>
  <text x="304" y="476" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="24" font-weight="600" text-anchor="middle">.</text>
</svg>
